{% load static %}
{% load bootstrap5 %}

<nav class="navbar navbar-expand-lg bg-primary sticky-top">
  <div class="container-fluid">

    <!-- Toggle button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03"
      aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span> <!-- ícone padrão do Bootstrap -->
    </button>

    <!-- Logo -->
    <a class="navbar-brand" href="#">
      <img src="{% static 'images/logo.png' %}" width="36" alt="Logo" />
    </a>

    <!-- Itens do menu -->
    <div class="collapse navbar-collapse justify-content-center" id="navbarTogglerDemo03">
      <ul class="navbar-nav mb-2 mb-lg-0 d-flex gap-3">
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="#">Preço</a></li>
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="#">Como funciona?</a></li>
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="#">Sobre</a></li>
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="#">Contato</a></li>
        <li class="nav-item"><a class="nav-link text-light hover-bold" href="#">Comprar</a></li>
      </ul>
    </div>

    {% if user.is_authenticated %}
    <!-- Avatar à direita (visível se logado) -->
    <ul class="navbar-nav">
      <li class="nav-item ">
        <a class="btn nav-link d-flex align-items-center" href="{% url 'chaveiros:dashboard' %}" >
            {% if user.foto_profile %}
            <img src="{{ user.foto_profile.url }}" width="36" height="36" class="rounded-circle border p-1" alt="Avatar do usuário" />
            {% else %}
            <img src="{% static 'images/avatar-default.jpg' %}" width="36" height="36" class="rounded-circle border p-1" alt="Avatar do usuário" />
            {% endif %}
        {% else %} 
        <div class="d-flex gap-2">
          <a href="{% url 'auth_app:entrar' %}" class="btn btn-outline-light">Login</a>
          <a href="{% url 'validar-codigo' %}" class="btn btn-outline-light">Cadastrar</a>
        </div>
        {% endif %}
        </a>
        
  </div>
</nav>
