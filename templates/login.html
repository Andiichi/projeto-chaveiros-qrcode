{% extends 'base.html' %}
{% load static %}

{% block title %}
Login
{% endblock %}


 
    <!-- Navigation -->
    {% include 'navbar.html' %}

{% block content %}


<div class="container">
    <!-- Outer Row -->
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Card Body -->
                    <div class="p-5">
                        <div class="text-center">
                            <h1 class=" text-gray-900 mb-4 display-6">Faça seu login!</h1>
                        </div>
                        <form method="POST" action="{% url 'auth_app:entrar' %}" class="user">

                            {% csrf_token %}

                            <div class="form-group">
                                <label for="email" class="form-label pl-4 ">Email:</label>
                                <input type="email" name="email" class="form-control form-control-user" id="email"
                                    placeholder="Digite seu email...">
                            </div>
                            <div class="form-group">
                                <label for="password" class="form-label pl-4 ">Senha:</label>
                                <input type="password" name="password" class="form-control form-control-user" id="password"
                                    placeholder="Digite sua senha...">

                            </div>
                            <div class="form-group">
                                <div class="custom-control custom-checkbox small">
                                    <input type="checkbox" class="custom-control-input" id="customCheck">
                                    <label class="custom-control-label" for="customCheck">Lembre-me</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-user btn-block">Entrar</button>

                            <hr>
                        </form>
                        <div class="text-center">
                            <a href="/">Esqueci minha senha.</a>
                        </div>
                        <div class="text-center">
                            <a href="{% url 'validar-codigo' %}">Criar uma conta.</a>
                        </div>
                        <hr>
                        <div class="text-center mt-2">
                            <a class="btn btn-dark" href="{% url 'auth_app:pagina_inicial' %}" role="button">Voltar à
                                página inicial</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
